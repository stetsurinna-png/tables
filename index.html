<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мої таблиці</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 6px 10px; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h1>Мої таблиці</h1>
<h2>Оцінки</h2>
<table>
  <tr>
    <th>Ім'я</th>
    <th>Оцінка</th>
  </tr>
  <tr>
    <td>Олена</td>
    <td>11</td>
  </tr>
  <tr>
    <td>Максим</td>
    <td>9</td>
  </tr>
</table>
</body>
</html>
